[project]
name = "retail-copilot"
version = "0.1.0"
description = "Retail Copilot - Inventory + AI assistant for small grocery shops"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.30.0,<0.31.0",
    "pydantic-settings>=2.4.0,<2.5.0",
    "sqlalchemy[asyncio]>=2.0.36,<2.1.0",
    "asyncpg>=0.29.0,<0.33.0",
    "alembic>=1.13.0,<1.14.0",
    "argon2-cffi>=23.1.0,<24.0.0",
    "pyjwt[crypto]>=2.9.0,<3.0.0",
    "email-validator>=2.4.0",
]

[dependency.groups]
test = [
    "httpx>=0.27.0,<0.28.0",
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<0.25.0",
]

[project.scripts]
retail-copilot = "app.main:cli"

[tool.uv]
# All dependencies are pinned by uv.lock (committed)

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[dependency-groups]
test = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]
