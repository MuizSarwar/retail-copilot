[alembic]
# path to migration scripts
script_location = alembic

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is expected to be one of:
# => "utc" (returns a datetime.datetime.utcnow() timestamp)
# => "local" (returns a datetime.datetime.now() timestamp)
# timezone = utc

# the version locatoin to use as the source of initial
# migrations.  defaults to `versions/` within the script
# location directory.
version_locations = %(here)s/alembic/versions

# the encoding used to load migration files and the env.py.
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate.
# this affects revision files created by the 'revision' command.
# default: true
revision_environment = true

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory.
# default: false
sourceless = false

# version path separator; As mentioned above, this is the character used
# to split version_locations. The default within new alembic.ini files is
# "os", which uses os.pathsep. If this key is omitted entirely, it falls
# back to the legacy behavior of splitting on spaces and/or commas.
# valid values for version_path_separator are:
# [ os | newline ]
version_path_separator = newline

# the output encoding used when revision files
# are written from script.py.mako.
output_encoding = utf-8

sqlalchemy.url = %(DATABASE_URL)s

[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
